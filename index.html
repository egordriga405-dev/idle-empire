<!DOCTYPE html>
<html lang="ru">
<head>
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e17"> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Idle Empire</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <header id="top-bar">
            <div class="resource-display" id="gold-display">🪙 <span id="gold-amount">0</span></div>
            <div class="resource-display" id="gems-display">💎 <span id="gems-amount">0</span></div>
        </header>
        
       <nav id="tab-bar">
    <button class="tab-btn active" data-tab="main">🏠</button>
    <button class="tab-btn" data-tab="generators">🏗️</button>
    <button class="tab-btn" data-tab="upgrades">⬆️</button>
    <button class="tab-btn" data-tab="missions">📋</button>
    <button class="tab-btn" data-tab="prestige">🌟</button>
    <button class="tab-btn" data-tab="settings">⚙️</button>
</nav> 
        
        <main id="content">
            <div class="tab-content active" id="tab-main">
                <div class="click-area" id="click-zone">
                    <div class="click-target" id="click-target">💎</div>
                    <div class="click-multiplier" id="click-mult">x1</div>
                    <div class="particles-container" id="particles"></div>
                </div>
                <div class="stats-bar">
                    <div class="stat">💰/сек: <span id="gps-display">0</span></div>
                    <div class="stat">👆/клик: <span id="cpc-display">1</span></div>
                    <div class="stat">🔥 Стрик: <span id="streak-display">0</span> дн.</div>
                </div>
                <div class="offline-earnings" id="offline-popup" style="display:none;">
                    <h3>Пока тебя не было:</h3>
                    <p id="offline-amount">+0 🪙</p>
                    <p id="offline-time">0 сек</p>
                    <button id="claim-offline">Забрать</button>
                </div>
                <div class="daily-reward" id="daily-popup" style="display:none;">
                    <h3>🎁 Ежедневная награда</h3>
                    <p>День <span id="daily-day">1</span></p>
                    <p id="daily-amount">+100 🪙</p>
                    <button id="claim-daily">Забрать</button>
                </div>
                <div id="missions-list"></div>
            </div>
            
            <div class="tab-content" id="tab-generators"></div>
            <div class="tab-content" id="tab-upgrades"></div>
            <div class="tab-content" id="tab-missions"></div>
            <div class="tab-content" id="tab-prestige"></div>
            <div class="tab-content" id="tab-settings"></div>
        </main>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/game.js"></script>
    <script src="js/generators.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
